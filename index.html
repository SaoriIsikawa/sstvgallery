<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="generator" content="HTML Tidy for HTML5 for Windows version 5.9.20">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSTV GALLERY</title>
  <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg: #060a0f;
            --panel: #10161d;
            --panel-alt: #161e27;
            --ink: #dce6ee;
            --ink-dim: #7d8b99;
            --line: rgba(95, 210, 255, 0.14);
            --green: #39ff9e;
            --cyan: #5fd2ff;
            --amber: #ffb020;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', 'Segoe UI', monospace;
            color: var(--ink);
            line-height: 1.6;
            padding: 24px;
            min-height: 100vh;
            background:
                repeating-linear-gradient(0deg, rgba(95, 210, 255, 0.035) 0px, rgba(95, 210, 255, 0.035) 1px, transparent 1px, transparent 40px),
                repeating-linear-gradient(90deg, rgba(95, 210, 255, 0.035) 0px, rgba(95, 210, 255, 0.035) 1px, transparent 1px, transparent 40px),
                var(--bg);
        }

        ::selection {
            background: var(--green);
            color: #04120a;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 32px;
            padding: 36px 30px 28px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -40%;
            width: 40%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--green), transparent);
            animation: scan-sweep 3.5s linear infinite;
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 2.1rem;
            letter-spacing: 0.08em;
            color: var(--ink);
            margin-bottom: 12px;
        }

        h1::before {
            content: '// ';
            color: var(--green);
        }

        header p {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            color: var(--ink-dim);
            text-transform: uppercase;
        }

        header p::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--amber);
            box-shadow: 0 0 6px var(--amber);
            animation: rec-pulse 1.6s ease-in-out infinite;
        }

        .folder-section {
            margin-bottom: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            overflow: hidden;
        }

        .folder-title {
            background: var(--panel-alt);
            color: var(--ink);
            padding: 15px 44px 15px 20px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease, border-left-color 0.2s ease;
            position: relative;
            border-left: 3px solid var(--green);
        }

        .folder-title span {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 400;
            color: var(--green);
        }

        .folder-title:hover {
            background: #1c2530;
        }

        .folder-title.collapsed {
            border-left-color: var(--ink-dim);
        }

        .folder-title::after {
            content: '▼';
            position: absolute;
            right: 20px;
            color: var(--cyan);
            font-size: 0.8em;
            transition: transform 0.3s ease;
        }

        .folder-title.collapsed::after {
            transform: rotate(-90deg);
        }

        .images-container {
            display: flex;
            flex-direction: column;
            gap: 1px;
            padding: 8px;
            max-height: 5000px;
            overflow-y: auto;
            transition: max-height 0.5s ease-out, opacity 0.3s ease;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
        }

        .images-container::-webkit-scrollbar {
            width: 8px;
        }

        .images-container::-webkit-scrollbar-thumb {
            background: var(--line);
            border-radius: 4px;
        }

        .images-container.collapsed {
            max-height: 0;
            padding-top: 0;
            padding-bottom: 0;
            opacity: 0;
            overflow: hidden;
        }

        .image-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: transparent;
            padding: 8px 12px;
            border-radius: 4px;
            transition: background 0.2s ease;
            cursor: pointer;
        }

        .image-item:hover,
        .image-item:focus-visible {
            background: var(--panel-alt);
            outline: 1px solid var(--line);
        }

        .image-wrapper {
            height: 1.4em;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 3px;
            border: 1px solid var(--line);
        }

        .image-wrapper img {
            height: 100%;
            width: auto;
            object-fit: contain;
        }

        .image-item:hover .image-wrapper {
            border-color: var(--green);
            box-shadow: 0 0 8px rgba(57, 255, 158, 0.35);
        }

        .image-name {
            flex: 1;
            font-size: 0.85rem;
            color: var(--ink-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .image-item:hover .image-name {
            color: var(--ink);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 6, 10, 0.94);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal::before,
        .modal::after {
            content: '';
            position: fixed;
            width: 26px;
            height: 26px;
            border: 2px solid var(--cyan);
            opacity: 0.8;
        }

        .modal::before {
            top: 26px;
            left: 26px;
            border-right: none;
            border-bottom: none;
        }

        .modal::after {
            bottom: 26px;
            right: 26px;
            border-left: none;
            border-top: none;
        }

        .modal img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border: 1px solid var(--line);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--ink-dim);
            font-size: 0.9rem;
            letter-spacing: 0.05em;
        }

        .loading::after {
            content: '_';
            animation: rec-pulse 1s steps(2) infinite;
        }

        :focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
        }

        @keyframes scan-sweep {
            0% { left: -40%; }
            100% { left: 100%; }
        }

        @keyframes rec-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.5rem; }
            header { padding: 26px 18px 22px; }
            .folder-title { padding: 13px 40px 13px 16px; font-size: 0.9rem; }
        }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>SSTV GALLERY</h1>
      <p>Received by BG7XTQ</p>
    </header>
    <div id="folders-container">
      <div class="loading">
        正在加载图片...
      </div>
    </div>
    <div id="image-modal" class="modal" onclick="closeModal(event)"><img id="modal-image" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="大图预览"></div>
  </div>
  <script>
        async function loadGallery() {
            try {
                const response = await fetch('data/gallery-data.json');
                const data = await response.json();
                displayGallery(data);
            } catch (error) {
                console.error('加载失败:', error);
                document.getElementById('folders-container').innerHTML = 
                    '<div class="loading">加载失败，请检查数据文件</div>';
            }
        }

        function displayGallery(data) {
            const container = document.getElementById('folders-container');
            container.innerHTML = '';

            for (const [folderName, images] of Object.entries(data)) {
                const folderSection = document.createElement('div');
                folderSection.className = 'folder-section';

                const imageCount = images.length;

                folderSection.innerHTML = `
                    <div class="folder-title collapsed" onclick="toggleFolder(this)">
                        ${folderName} <span style="font-size: 0.85em; opacity: 0.8; margin-left: 10px;">(${imageCount})</span>
                    </div>
                    <div class="images-container collapsed">
                        ${images.map(image => `
                            <div class="image-item" onclick="showImage('${image.url}')">
                                <div class="image-wrapper">
                                    <img src="${image.url}" alt="${image.name}" loading="lazy">
                                </div>
                                <div class="image-name">${image.name}</div>
                            </div>
                        `).join('')}
                    </div>
                `;

                container.appendChild(folderSection);
            }
        }

        function toggleFolder(titleElement) {
            const imagesContainer = titleElement.nextElementSibling;
            titleElement.classList.toggle('collapsed');
            imagesContainer.classList.toggle('collapsed');
        }

        function showImage(url) {
            const modal = document.getElementById('image-modal');
            const modalImg = document.getElementById('modal-image');
            modalImg.src = url;
            modal.classList.add('active');
        }

        function closeModal(e) {
            if (e.target.id === 'image-modal') {
                const modal = document.getElementById('image-modal');
                modal.classList.remove('active');
            }
        }

        // 页面加载时获取数据
        loadGallery();
  </script>
</body>
</html>
